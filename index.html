<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашня робота</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📝 Хойка база</h1>
        
        <!-- Основна секція з додаванням елементів -->
        <div class="card">
            <h2>Додати елемент у список</h2>
            <div class="input-section">
                <input type="text" id="textInput" placeholder="Введіть текст...">
                <button id="addButton">Додати</button>
            </div>
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="🔍 Пошук у списку...">
            </div>
            <div id="listContainer">
                <ul id="itemsList"></ul>
                <div class="empty-state" id="emptyState">Список порожній. Додайте перший елемент!</div>
            </div>
        </div>

        <!-- Ряд з двома секціями -->
        <div class="sections-row">
            <!-- Секція з лідерами -->
            <div class="card">
                <h2>🎖️ Hearts of Iron 4 - Лідери Країн</h2>
                <div class="api-section">
                    <div class="api-buttons">
                        <button id="loadCharactersBtn">Завантажити лідерів</button>
                        <button id="clearCharactersBtn" style="background: #ff4757;">Очистити</button>
                    </div>
                    <div class="search-section">
                        <input type="text" id="searchCharacters" placeholder="🔍 Пошук лідерів...">
                    </div>
                    <div id="charactersContainer"></div>
                </div>
            </div>

            <!-- Секція з доктринами -->
            <div class="card">
                <h2>📚 Vojašові Доктрини HOI4</h2>
                <div class="doctrines-section">
                    <div class="api-buttons">
                        <button id="loadDoctrinesBtn" style="background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);">Показати доктрини</button>
                        <button id="clearDoctrinesBtn" style="background: #ff4757;">Очистити</button>
                    </div>
                    <div class="search-section">
                        <input type="text" id="searchDoctrines" placeholder="🔍 Пошук доктрин...">
                    </div>
                    <div id="doctrinesContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
